stages:
    - image-build-and-push
    - upload-dist-to-s3
    - invalidate-cloudfront

include:
    - project: sre/cicd-templates
      file: steps/build-ecr-v3.yaml
      ref: main
    - project: sre/cicd-templates
      file: steps/docker-to-s3.yaml
      ref: main
    - project: sre/cicd-templates
      file: steps/invalidate-cloudfront.yaml
      ref: main

build-staging:
    extends: .image-build-and-push-v3
    tags:
        - upbase-prod-default
    stage: image-build-and-push
    variables:
        DOCKER_IMAGE_NAME: upbase/agency-webapp
        BUILD_ARGS_REACT_APP_MODE: STAG
        BUILD_ARGS_REACT_APP_ONESIGNAL_APP_ID: 05d620d3-4c28-4f7e-a565-f0404811bf57
        BUILD_ARGS_REACT_APP_SME_ENDPOINT: https://ups.staging.upbase.asia
        BUILD_ARGS_REACT_APP_GRAPHQL_ENDPOINT: https://agency-api.staging.upbase.asia/v1/graphql
        BUILD_ARGS_REACT_APP_GRAPHQL_WS_ENDPOINT: wss://chat-system.staging.upbase.asia/graphql
        BUILD_ARGS_REACT_APP_URL_FILE_UPLOAD: https://ulti.staging.upbase.asia/files/upload
        BUILD_ARGS_REACT_APP_CHATTING_SOCKET_URL: https://chat-system.staging.upbase.asia/
        BUILD_ARGS_REACT_APP_VERSION: ${CI_COMMIT_SHA:0:7}
    only:
        refs:
            - main
            - master

stag-upload-dist-to-s3:
    extends: .upload-from-image-to-s3
    stage: upload-dist-to-s3
    tags:
        - upbase-prod-default
    variables:
        S3_ACL: public-read
        FOLDER_MAPPINGS: |
            /app/build:s3://staging-agency
    only:
        refs:
            - main
            - master
            - feature/ci-cd-test
    needs:
        - job: build-staging
          artifacts: true

stag-invalidate-cloudfront:
    extends: .invalidate-cloudfront
    stage: invalidate-cloudfront
    tags:
        - upbase-prod-default
    variables:
        ROLE_ARN: CloudfrontCacheInvalidationAgencyWebApp
        DISTRIBUTION_ID: E3UHLQW2QMSFT
        INVALIDATION_PATHS: |
            /index.html
    only:
        refs:
            - main
            - master

build-production:
    extends: .image-build-and-push-v3
    tags:
        - upbase-prod-default
    stage: image-build-and-push
    variables:
        DOCKER_IMAGE_NAME: upbase/agency-webapp
        BUILD_ARGS_REACT_APP_MODE: PROD
        BUILD_ARGS_REACT_APP_SME_ENDPOINT: "https://ups.upbase.asia"
        BUILD_ARGS_REACT_APP_ONESIGNAL_APP_ID: "a7a483ce-098e-4d75-8499-3bdd51accb96"
        BUILD_ARGS_REACT_APP_GRAPHQL_ENDPOINT: "https://agency-api.upbase.asia/v1/graphql"
        BUILD_ARGS_REACT_APP_GRAPHQL_WS_ENDPOINT: "wss://chat-system.upbase.asia/graphql"
        BUILD_ARGS_REACT_APP_URL_FILE_UPLOAD: "https://util.upbase.asia/files/upload"
        BUILD_ARGS_REACT_APP_CHATTING_SOCKET_URL: "https://socket.upbase.asia/"
        BUILD_ARGS_REACT_APP_VERSION: "v.${CI_COMMIT_SHA:0:7}"
        BUILD_ARGS_REACT_APP_GA_ID: G-2J13F3VXQG
        BUILD_ARGS_REACT_APP_SENTRY_URL: "https://710e538efc0b4ceb9c4cacc4cb54f9a1@o4504169513680896.ingest.sentry.io/4504248631623680"
    only:
        refs:
            - prod

prod-upload-dist-to-s3:
    extends: .upload-from-image-to-s3
    stage: upload-dist-to-s3
    tags:
        - upbase-prod-default
    variables:
        S3_ACL: public-read
        FOLDER_MAPPINGS: |
            /app/build:s3://prod-agency
    only:
        refs:
            - prod
    needs:
        - job: build-production
          artifacts: true

prod-invalidate-cloudfront:
    extends: .invalidate-cloudfront
    stage: invalidate-cloudfront
    tags:
        - upbase-prod-default
    variables:
        ROLE_ARN: CloudfrontCacheInvalidationAgencyWebApp
        DISTRIBUTION_ID: E1HDRLHR4S075H
        INVALIDATION_PATHS: |
            /index.html
    only:
        refs:
            - prod
